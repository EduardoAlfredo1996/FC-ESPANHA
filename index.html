      db.financas.quotas = quotasTotal;

    function comprimirImagem(file, maxWidth, maxHeight, quality, callback) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var width = img.width;
          var height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ================= FILTRAGEM E ORDENAÇÃO DO PLANTEL =================
    function obterPlantelFiltradoEOrdenado() {
      var termo = (document.getElementById('inp-busca-jogador') ? document.getElementById('inp-busca-jogador').value : '').toLowerCase().trim();
      var pos = document.getElementById('sel-posicao-plantel') ? document.getElementById('sel-posicao-plantel').value : 'todas';
      var sit = document.getElementById('sel-situacao-plantel') ? document.getElementById('sel-situacao-plantel').value : 'todas';
      var ordem = document.getElementById('sel-ordem-plantel') ? document.getElementById('sel-ordem-plantel').value : 'camisola';

      var lista = DB.jogadores.filter(function(j) {
        var matchNome = j.nome.toLowerCase().indexOf(termo) !== -1 || String(j.numero).indexOf(termo) !== -1;
        var matchPos = (pos === 'todas' || j.posicao === pos);
        var matchSit = (sit === 'todas' || j.situacao === sit);
        return matchNome && matchPos && matchSit;
      });

      lista.sort(function(a, b) {
        if (ordem === 'camisola') return a.numero - b.numero;
        if (ordem === 'alfabetica') return a.nome.localeCompare(b.nome);
        if (ordem === 'golos') return (b.golos || 0) - (a.golos || 0);
        if (ordem === 'assistencias') return (b.assistencias || 0) - (a.assistencias || 0);
        if (ordem === 'idade_velho') return new Date(a.nasc) - new Date(b.nasc);
        if (ordem === 'idade_novo') return new Date(b.nasc) - new Date(a.nasc);
        if (ordem === 'entrada_recente') return new Date(b.dataEntrada) - new Date(a.dataEntrada);
        return 0;
      });

      return lista;
    }

    // ================= FUNÇÃO CENTRAL: DESENHAR (RENDER DA TELA) =================
    function desenhar() {
      // 1. Estatísticas do Painel
      var ativos = 0, inativos = 0;
      for (var i = 0; i < DB.jogadores.length; i++) {
        if (DB.jogadores[i].situacao === 'Activo') ativos++;
        else inativos++;
      }
      setText('stat-plantel-activos', ativos);
      setText('stat-plantel-inactivos', inativos);

      var saldo = DB.financas.receitas - DB.financas.despesas;
      setText('stat-saldo', kz(saldo));
      setText('stat-receitas', kz(DB.financas.receitas));
      setText('stat-despesas', kz(DB.financas.despesas));
      setText('stat-quotas-total', kz(DB.financas.quotas));

      // Barra financeira proporcional
      var totalMov = DB.financas.receitas + DB.financas.despesas;
      if (totalMov > 0) {
        var pRec = Math.round((DB.financas.receitas / totalMov) * 100);
        var pDesp = 100 - pRec;
        var barraR = document.getElementById('barra-receita');
        var barraD = document.getElementById('barra-despesa');
        if (barraR) barraR.style.width = pRec + '%';
        if (barraD) barraD.style.width = pDesp + '%';
        setText('txt-proporcao-fin', pDesp + '% Despesas / ' + pRec + '% Receitas');
      }

      // 2. Tabela de Plantel
      var tbPlantel = document.getElementById('tb-plantel');
      if (tbPlantel) {
        var plantelFiltrado = obterPlantelFiltradoEOrdenado();
        var htmlPlantel = '';
        if (plantelFiltrado.length === 0) {
          htmlPlantel = '<tr><td colspan="11" style="text-align:center; padding:18px; color:#94A3B8;">Nenhum atleta registado ou encontrado.</td></tr>';
        } else {
          for (var p = 0; p < plantelFiltrado.length; p++) {
            var at = plantelFiltrado[p];
            var badgeCor = (at.situacao === 'Activo' ? 'badge-ativo' : (at.situacao === 'Lesionado' ? 'badge-lesionado' : (at.situacao === 'Suspenso' ? 'badge-suspenso' : 'badge-inativo')));
            
            htmlPlantel += '<tr>' +
              '<td><img src="' + (at.foto || SILHUETA_PADRAO) + '" class="foto-atleta"></td>' +
              '<td style="font-weight:bold; color:#E5A93C;">#' + at.numero + '</td>' +
              '<td><b>' + at.nome + '</b><br><span style="font-size:10px; color:#888;">' + (at.telefone || '') + '</span></td>' +
              '<td>' + at.posicao + '</td>' +
              '<td>' + calcularIdade(at.nasc) + '</td>' +
              '<td>' + formatarDataBR(at.dataEntrada) + '</td>' +
              '<td><span class="badge-status ' + badgeCor + '">' + (at.situacao || 'Activo') + '</span></td>' +
              '<td style="color:#10B981; font-weight:bold;">' + (at.golos || 0) + '</td>' +
              '<td style="color:#60A5FA; font-weight:bold;">' + (at.assistencias || 0) + '</td>' +
              '<td><code style="color:#E5A93C; font-weight:bold; background:#070B19; padding:2px 6px; border-radius:4px;">' + (at.credencial || '') + '</code></td>' +
              '<td>' +
                '<button class="btn btn-dark" style="padding:4px 8px; font-size:10px;" onclick="abrirModalEditarJogador(' + at.id + ')">✏️</button> ' +
                '<button class="btn btn-red" style="padding:4px 8px; font-size:10px;" onclick="removerJogador(' + at.id + ')">🗑️</button> ' +
                '<button class="btn btn-wpp" style="padding:4px 8px; font-size:10px;" title="Reenviar WhatsApp" onclick="reenviarAcessoWpp(' + at.id + ')">📲</button>' +
              '</td>' +
            '</tr>';
          }
        }
        tbPlantel.innerHTML = htmlPlantel;
      }

      // 3. Comunicados
      var listaAnun = document.getElementById('lista-anuncios');
      if (listaAnun) {

    // ================= FILTRAR CONTROLO DE QUOTAS DA SEMANA =================
    function filtrarControleQuotas() {
      var domRef = (document.getElementById('filtro-domingo-ref') ? document.getElementById('filtro-domingo-ref').value : '').toLowerCase().trim();
      var atletasPagos = [];
      var atletasPendentes = [];

      for (var i = 0; i < DB.jogadores.length; i++) {
        var at = DB.jogadores[i];
        var pagou = false;
        for (var q = 0; q < DB.historicoQuotas.length; q++) {
          var h = DB.historicoQuotas[q];
          if (h.atleta === at.nome && (!domRef || h.mes.toLowerCase().indexOf(domRef) !== -1)) {
            pagou = true;
            break;
          }
        }
        if (pagou) atletasPagos.push(at);
        else atletasPendentes.push(at);
      }

      setText('qtd-pagos', atletasPagos.length);
      setText('qtd-pendentes', atletasPendentes.length);

      var boxPagos = document.getElementById('lista-atletas-pagos');
      var boxPend = document.getElementById('lista-atletas-pendentes');

      if (boxPagos) {
        var htmlP = '';
        for (var p = 0; p < atletasPagos.length; p++) {
          htmlP += '<div style="padding:4px 0; border-bottom:1px solid #10B98144;">✅ #' + atletasPagos[p].numero + ' ' + atletasPagos[p].nome + '</div>';
        }
        boxPagos.innerHTML = htmlP || '<p style="color:#888;">Nenhum pagamento registado para esta semana.</p>';
      }

      if (boxPend) {
        var htmlPend = '';
        for (var pd = 0; pd < atletasPendentes.length; pd++) {
          htmlPend += '<div style="padding:4px 0; border-bottom:1px solid #EF444444; display:flex; justify-content:space-between; align-items:center;">' +
            '<span>❌ #' + atletasPendentes[pd].numero + ' ' + atletasPendentes[pd].nome + '</span>' +
            (perfil !== 'jogador' ? '<button class="btn btn-gold" style="padding:2px 6px; font-size:9px;" onclick="abrirModalLiquidarQuota(\'' + atletasPendentes[pd].nome + '\')">Liquidar</button>' : '') +
          '</div>';
        }
        boxPend.innerHTML = htmlPend || '<p style="color:#34D399;">Todos os atletas liquidaram a quota!</p>';
      }
    }

    // ================= EXPORTAÇÕES EXCEL (CSV COMPATÍVEL) =================
    function baixarArquivoCSV(conteudo, nomeArquivo) {
      var blob = new Blob(["\uFEFF" + conteudo], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement("a");
      var url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", nomeArquivo);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

      var conteudo = DB.fotoClube 
        ? '<img src="' + DB.fotoClube + '" style="max-width:100%; max-height:100%; border-radius:6px; object-fit:contain;">'
        : EMBLEMA_PADRAO_SVG;

      if (boxPortal) boxPortal.innerHTML = conteudo;
      if (boxTopo) boxTopo.innerHTML = conteudo;
      if (boxPdf) boxPdf.innerHTML = conteudo;
    }

    function descarregarBackup() {
      var dadosStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
      var downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dadosStr);
      downloadAnchor.setAttribute("download", "FC_ESPANHA_BACKUP_" + obterDataHoje() + ".json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      registarAuditoria("Descarregou backup JSON");
      mostrarAviso("💾 Backup descarregado!");
    }

    function restaurarBackup(input) {
      if (perfil !== 'dev') return;
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var importado = JSON.parse(e.target.result);
            if (importado.jogadores && importado.financas) {
              DB = sanitizarDB(importado);
              registarAuditoria("Restaurou cópia de segurança");
              salvarDB();
              desenharEmblemas();
              desenhar();
              alert("✅ Base de dados restaurada com sucesso!");
            } else {
              alert("❌ Ficheiro de backup inválido.");
            }
          } catch(err) {
            alert("❌ Erro ao ler ficheiro de backup.");
          }
        };
        reader.readAsText(input.files[0]);
      }
    }

    function limparTudoDefinitivo() {
      if (perfil !== 'dev') return;
      var confirmSenha = prompt("⚠️ ATENÇÃO EDUARDO ALFREDO:\nPara zerar totalmente a base de dados, confirme a sua Senha Mestre:");
      if (!confirmSenha || !verificarSenhaMaster(confirmSenha)) {
        alert("❌ Senha Mestre incorreta! Operação cancelada.");
        return;
      }
      DB.jogadores = [];
      DB.jogos = [];
      DB.historicoQuotas = [];
      DB.despesasLista = [];
      DB.doacoes = [];
      DB.disciplina = [];
      DB.auditoria = [];
      DB.proximoRecibo = 1;
      registarAuditoria("Reiniciou e zerou a base de dados");
      salvarDB();
      desenhar();
      alert("✅ Sistema totalmente limpo e pronto.");
    }

    // ================= GERADORES DE RELATÓRIO PDF =================
    function gerarPDFPlantel() {
      var lista = obterPlantelFiltradoEOrdenado();
      if (lista.length === 0) { alert("Cadastre primeiro atletas para gerar a lista."); return; }

      setText('pdf-titulo-documento', 'RELAÇÃO NOMINAL DO PLANTEL SÉNIOR OFICIAL');
      setText('pdf-data-emissao', obterDataHoraAtual());

      var html = '<table>' +
        '<thead><tr>' +
          '<th>Foto</th><th>Nº</th><th>Nome Completo</th><th>Posição</th><th>Idade (Nasc.)</th><th>Admissão</th><th>Situação</th><th>Contacto</th>' +
        '</tr></thead><tbody>';

      for (var i = 0; i < lista.length; i++) {
        var a = lista[i];
        html += '<tr>' +
          '<td style="text-align:center;"><img src="' + (a.foto || SILHUETA_PADRAO) + '" style="width:24px; height:24px; border-radius:50%; object-fit:cover;"></td>' +
          '<td style="text-align:center; font-weight:bold;">#' + a.numero + '</td>' +
          '<td><b>' + a.nome + '</b></td>' +
          '<td>' + a.posicao + '</td>' +
          '<td>' + calcularIdade(a.nasc) + ' (' + formatarDataBR(a.nasc) + ')</td>' +
          '<td>' + formatarDataBR(a.dataEntrada) + '</td>' +
          '<td>' + (a.situacao || 'Activo') + '</td>' +
          '<td>' + a.telefone + '</td>' +
        '</tr>';
      }
      html += '</tbody></table>' +
        '<p style="margin-top:10px; font-size:10px; color:#555;">Total de Jogadores: <b>' + lista.length + ' atletas registados</b>.</p>';

      document.getElementById('pdf-conteudo-dinamico').innerHTML = html;
      window.print();
    }

    function gerarPDFFinanceiro() {
      setText('pdf-titulo-documento', 'RELATÓRIO FINANCEIRO & BALANÇO DA TESOURARIA');
      setText('pdf-data-emissao', obterDataHoraAtual());

      var saldo = DB.financas.receitas - DB.financas.despesas;
      var totalExpress = 0, totalCash = 0;
      for (var q = 0; q < DB.historicoQuotas.length; q++) {
        var it = DB.historicoQuotas[q];
        if (it.metodo && it.metodo.indexOf('Express') !== -1) totalExpress += it.valor;
        else totalCash += it.valor;
      }

      var html = '<h4 style="margin:8px 0; color:#0F172A;">1. Balanço Geral em Caixa:</h4>' +
        '<table>' +
          '<thead><tr><th>Total Receitas</th><th>Total Despesas</th><th>Saldo Líquido em Caixa</th></tr></thead>' +
          '<tbody><tr>' +
            '<td style="font-weight:bold; color:green;">' + kz(DB.financas.receitas) + '</td>' +
            '<td style="font-weight:bold; color:red;">' + kz(DB.financas.despesas) + '</td>' +
            '<td style="font-weight:bold; font-size:13px;">' + kz(saldo) + '</td>' +
          '</tr></tbody>' +
        '</table>' +
        '<h4 style="margin:14px 0 6px 0; color:#0F172A;">2. Resumo de Quotas por Modalidade:</h4>' +
        '<table>' +
          '<thead><tr><th>Modalidade</th><th>Total Liquidado</th><th>Observações</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>📲 Multicaixa Express (935 523 498)</td><td style="font-weight:bold;">' + kz(totalExpress) + '</td><td>Pagamentos remotos com comprovativo via WhatsApp</td></tr>' +
            '<tr><td>💵 Em Cash (Dinheiro Vivo)</td><td style="font-weight:bold;">' + kz(totalCash) + '</td><td>Pagamentos em espécie ao Tesoureiro no campo</td></tr>' +
            '<tr><td><b>TOTAL DE QUOTAS RECEBIDAS</b></td><td style="font-weight:bold; color:#0F172A;">' + kz(DB.financas.quotas) + '</td><td><b>Acumulado total de quotas</b></td></tr>' +
          '</tbody>' +
        '</table>';

      document.getElementById('pdf-conteudo-dinamico').innerHTML = html;
      window.print();
    }

    function gerarPDFDesempenho() {
      setText('pdf-titulo-documento', 'RELATÓRIO DE DESEMPENHO, ARTILHARIA & DISCIPLINA');
      setText('pdf-data-emissao', obterDataHoraAtual());

      var lista = DB.jogadores.slice();
      lista.sort(function(a,b) { return (b.golos || 0) - (a.golos || 0); });

      var html = '<h4 style="margin:8px 0; color:#0F172A;">1. Tabela de Artilharia (Golos & Assistências):</h4>' +
        '<table><thead><tr><th>Class.</th><th>Nº</th><th>Nome do Jogador</th><th>Posição</th><th>Jogos</th><th>Golos ⚽</th><th>Assistências 👟</th></tr></thead><tbody>';
      
      for (var i = 0; i < lista.length; i++) {
        html += '<tr>' +
          '<td style="text-align:center;">' + (i+1) + 'º</td>' +
          '<td style="text-align:center;"><b>#' + lista[i].numero + '</b></td>' +
          '<td><b>' + lista[i].nome + '</b></td>' +
          '<td>' + lista[i].posicao + '</td>' +
          '<td>' + (lista[i].jogosDisputados || 0) + '</td>' +
          '<td style="text-align:center; font-weight:bold;">' + (lista[i].golos || 0) + ' ⚽</td>' +
          '<td style="text-align:center;">' + (lista[i].assistencias || 0) + ' 👟</td>' +
        '</tr>';
      }
      html += '</tbody></table>';

      document.getElementById('pdf-conteudo-dinamico').innerHTML = html;
      window.print();
    }

    function gerarPDFFichaAtleta() {
      var at = obterAtletaSessao();
      if (!at) return;
      setText('pdf-titulo-documento', 'FICHA INDIVIDUAL DO ATLETA');
      setText('pdf-data-emissao', obterDataHoraAtual());

      var html = '<div style="display:flex; gap:16px; align-items:center; border:1px solid #333; padding:10px; margin-bottom:12px;">' +
        '<img src="' + (at.foto || SILHUETA_PADRAO) + '" style="width:85px; height:85px; border-radius:10px; object-fit:cover; border:2px solid #0F172A;">' +
        '<div>' +
          '<h2 style="margin:0; font-size:16px; color:#0F172A;">#' + at.numero + ' ' + at.nome + '</h2>' +
          '<p style="font-size:11px; margin:2px 0;">Posição: <b>' + at.posicao + '</b> | Situação: <b>' + (at.situacao || 'Activo') + '</b></p>' +
          '<p style="font-size:11px; margin:2px 0;">Idade: <b>' + calcularIdade(at.nasc) + '</b> (' + formatarDataBR(at.nasc) + ') | Bairro: <b>' + (at.bairro || 'Luanda') + '</b></p>' +
          '<p style="font-size:11px; margin:2px 0;">No Clube Desde: <b>' + formatarDataBR(at.dataEntrada) + '</b> | Contacto: <b>' + at.telefone + '</b></p>' +
          '<p style="font-size:11px; margin:2px 0; font-weight:bold;">Estatísticas: ' + (at.golos || 0) + ' Golos ⚽ | ' + (at.assistencias || 0) + ' Assistências 👟</p>' +
        '</div>' +
      '</div>' +
      '<h4 style="margin:10px 0 4px 0; color:#0F172A;">Histórico de Quotas Liquidadas:</h4>' +
      '<table><thead><tr><th>Nº Recibo</th><th>Período</th><th>Valor Liquidado</th><th>Modalidade</th></tr></thead><tbody>';

      var total = 0, count = 0;
      for (var i = 0; i < DB.historicoQuotas.length; i++) {
        var q = DB.historicoQuotas[i];
        if (q.atleta === at.nome) {
          count++;
          total += q.valor;
          html += '<tr><td>' + (q.recibo || '--') + '</td><td>' + q.mes + '</td><td><b>' + kz(q.valor) + '</b></td><td>' + q.metodo + '</td></tr>';
        }
      }
      if (count === 0) html += '<tr><td colspan="4" style="text-align:center;">Nenhuma quota registada até ao momento.</td></tr>';
      html += '</tbody></table>' +
        '<p style="text-align:right; font-size:11px; font-weight:bold; margin-top:6px;">Total Acumulado Pago: ' + kz(total) + '</p>';

      document.getElementById('pdf-conteudo-dinamico').innerHTML = html;
      window.print();
    }

    // ================= ARRANQUE DO SISTEMA =================
    setValue('filtro-domingo-ref', obterDomingoAtual());
    setValue('cad-entrada', obterDataHoje());
    setValue('desp-data', obterDataHoje());

    desenharEmblemas();

    setDisplay('plataforma-conteudo', 'none');

    alternarFormLogin('jogador');

    setTimeout(function() {
      sincronizarComSupabase();
    }, 150);
  </script>
